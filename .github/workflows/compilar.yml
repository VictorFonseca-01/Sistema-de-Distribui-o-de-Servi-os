name: Compilar Executaveis
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Compilar com g++
        run: |
          g++ supervisor.cpp -o supervisor.exe -lws2_32
          g++ funcionario.cpp -o funcionario.exe -lws2_32

      - name: Disponibilizar para Download
        uses: actions/upload-artifact@v4
        with:
          name: executaveis-atualizados
          path: |
            supervisor.exe
            funcionario.exe
